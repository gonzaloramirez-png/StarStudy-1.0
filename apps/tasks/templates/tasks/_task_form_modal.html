<div class="modal fade" id="task-modal" tabindex="-1" aria-labelledby="taskModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="taskModalTitle">
                    {% if is_personal %}Nueva tarea personal{% else %}Asignar tarea{% endif %}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form method="post" enctype="multipart/form-data" id="task-form"
                      aria-label="{% if is_personal %}Nueva tarea personal{% else %}Asignar tarea{% endif %}"
                      hx-post="{% url 'task_create' %}{% if is_personal %}?personal=1{% endif %}"
                      hx-target="#task-modal-container"
                      hx-swap="innerHTML">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {% if field.errors %}
                        <div class="text-danger small mb-1">
                            {% for error in field.errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}
                        </div>
                        {% endif %}
                        {{ field }}
                    </div>
                    {% endfor %}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
