{% extends 'base.html' %}
{% block title %}{% if course %}Editar{% else %}Nuevo{% endif %} Curso - StarStudy{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-{% if course %}pencil{% else %}plus-lg{% endif %} me-2"></i>{% if course %}Editar Curso{% else %}Nuevo Curso{% endif %}</h2>
    <a href="{% url 'courses:course_list' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Volver
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_name" class="form-label fw-bold">Nombre del curso <span class="text-danger">*</span></label>
                        <input type="text" name="name" id="id_name" class="form-control" required
                               value="{{ course.name|default:'' }}" placeholder="Ej: Matemáticas 5to A">
                    </div>
                    <div class="mb-3">
                        <label for="id_description" class="form-label">Descripción</label>
                        <textarea name="description" id="id_description" class="form-control" rows="3"
                                  placeholder="Descripción breve del curso...">{{ course.description|default:'' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="id_academic_year" class="form-label">Año lectivo</label>
                        <input type="text" name="academic_year" id="id_academic_year" class="form-control"
                               value="{{ course.academic_year|default:academic_year }}" placeholder="Ej: 2024">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>{% if course %}Guardar cambios{% else %}Crear curso{% endif %}
                        </button>
                        <a href="{% url 'courses:course_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
