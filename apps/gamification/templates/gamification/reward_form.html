{% extends 'base.html' %}
{% block title %}{{ action }} Recompensa - StarStudy{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-6">
        <h4 class="mb-4"><i class="bi bi-gift me-2"></i>{{ action }} Recompensa</h4>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label text-muted">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
            {% endfor %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                <a href="{% url 'gamification:reward_list' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
