{% extends 'base.html' %}
{% block title %}Nuevo Desafío - DEV{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'dev:challenge_list' %}" class="text-decoration-none">Desafíos</a></li>
        <li class="breadcrumb-item active">Nuevo</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0" style="background: rgba(255,255,255,0.03);">
            <div class="card-header"><i class="bi bi-plus-circle me-2"></i>Nuevo Desafío</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100">Crear Desafío</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
