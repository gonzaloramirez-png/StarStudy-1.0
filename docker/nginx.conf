# ========================================
# StarStudy - Nginx Configuration
# ========================================
# Reverse proxy para Gunicorn + servir static/media
# SSL termination (certificados en ./docker/ssl/)
# ========================================

# Upstream Gunicorn
upstream starstudy_web {
    server web:8000;
    keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Se sobrescribe con variable de entorno en runtime si se desea

    # Redirigir HTTP a HTTPS (excepto healthcheck y ACME challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health/ {
        proxy_pass http://starstudy_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ========================================
    # SSL (certificados generados con Let's Encrypt o autofirmados)
    # Coloca tus certificados en ./docker/ssl/
    #   - starstudy.crt (certificado + chain)
    #   - starstudy.key (clave privada)
    # ========================================
    ssl_certificate /etc/nginx/ssl/starstudy.crt;
    ssl_certificate_key /etc/nginx/ssl/starstudy.key;

    # Configuración SSL segura (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Tamaño máximo de subida (ajustar según necesidad)
    client_max_body_size 10M;

    # ========================================
    # Archivos estáticos (WhiteNoise + Nginx cache)
    # ========================================
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Gzip precomprimido por WhiteNoise
        gzip_static on;
    }

    # ========================================
    # Archivos media (uploads usuarios)
    # ========================================
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ========================================
    # API / Django (proxy a Gunicorn)
    # ========================================
    location / {
        # Rate limiting global
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://starstudy_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # WebSocket support (si usas Channels)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========================================
    # Login/registro - rate limiting estricto
    # ========================================
    location ~ ^/(login|register|password_reset) {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass http://starstudy_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Healthcheck (sin rate limit, sin log)
    # ========================================
    location /health/ {
        proxy_pass http://starstudy_web;
        proxy_set_header Host $host;
        access_log off;
    }

    # ========================================
    # Logs
    # ========================================
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}

